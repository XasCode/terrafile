# This workflow reports the repository's ESLint results to GitHub code scanning.
name: ESLint Code Scan

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: "36 18 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  eslint-code-scan:
    name: ESLint Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint and generate SARIF
        id: eslint
        continue-on-error: true
        run: npm run lint -- --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif

      - name: Upload SARIF results file
        if: always() && hashFiles('eslint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: eslint-results.sarif
          category: codacy-eslint

      - name: Fail when ESLint reports findings
        if: steps.eslint.outcome == 'failure'
        run: exit 1
