name: Qlty Coverage

on: [push, pull_request]

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    name: Coverage / Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild esbuild
      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
      - name: Run ESLint
        run: npm run lint
      - name: Run Qlty checks
        run: qlty check --all --no-fix --no-progress --no-fail
      - name: Run tests and collect coverage
        run: npm test
      - name: Verify coverage report
        run: test -s coverage/lcov.info
      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          fail_ci_if_error: true
          verbose: true
      - name: Upload coverage to Codacy
        if: ${{ github.event_name == 'push' }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info
          language: javascript
          force-coverage-parser: lcov